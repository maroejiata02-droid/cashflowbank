<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--green1:#6e8b3d; --purple2:#2b1055; --purpleBtn:#7c3aed; --green:#22c55e; --red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.page{padding:20px;max-width:500px;margin:0 auto;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hid{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:20px;padding:24px;margin-bottom:24px;border:1px solid rgba(255,255,255,0.2)}
.balance-card h1{font-size:36px;font-weight:800;margin:8px 0}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:16px 0;text-align:center;cursor:pointer}
.history-box{max-height:350px; overflow-y:auto; padding-right:4px}

/* GLASS CARDS - NO YELLOW */
.tx-item{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.12); /* GLASS */
  backdrop-filter:blur(5px);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff; /* WHITE TEXT */
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}
.tx-left{display:flex;gap:12px;align-items:center}
.tx-icon{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center}
.tx-title{font-weight:700;font-size:15px}
.tx-date{font-size:12px;opacity:0.7}
.tx-amt{font-weight:800;font-size:15px}
.income{color:var(--green)}
.expense{color:var(--red)}
.send-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:24px;padding:24px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{cursor:pointer;padding:8px;background:rgba(255,255,255,0.1);border-radius:10px}
.input{width:100%;padding:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;margin-bottom:12px}
.send-btn{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px}
</style>
</head>
<body>

<div id="page1" class="page">
  <div class="topbar">
    <div><h2>Hello, John 👋</h2><small style="opacity:0.8">Welcome back</small></div>
    <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center"><i data-lucide="user"></i></div>
  </div>

  <div class="balance-card">
    <small>Available Balance</small>
    <h1>$3,501,439.22</h1>
    <small>Account: **** 7756</small>
  </div>

  <div class="actions">
    <div class="action" onclick="showPage('page2')"><i data-lucide="send"></i><br><span>Send</span></div>
    <div class="action" onclick="alert('Request')"><i data-lucide="download"></i><br><span>Request</span></div>
    <div class="action" onclick="alert('TopUp')"><i data-lucide="credit-card"></i><br><span>TopUp</span></div>
    <div class="action" onclick="alert('More')"><i data-lucide="grid-3x3"></i><br><span>More</span></div>
  </div>

  <h3 style="font-weight:700;margin-bottom:12px">Transaction History</h3>
  
  <div class="history-box">
    <div class="tx-item">
      <div class="tx-left"><div class="tx-icon"><i data-lucide="briefcase" style="color:var(--green)"></i></div>
      <div><div class="tx-title">Salary Credit</div><div class="tx-date">Today, 09:15 AM</div></div></div>
      <div class="tx-amt income">+$2,000,000.00</div>
    </div>

    <div class="tx-item">
      <div class="tx-left"><div class="tx-icon"><i data-lucide="hammer" style="color:var(--red)"></i></div>
      <div><div class="tx-title">Building Materials</div><div class="tx-date">11 Mar, 2:10 PM</div></div></div>
      <div class="tx-amt expense">-$45,000.00</div>
    </div>

    <div class="tx-item">
      <div class="tx-left"><div class="tx-icon"><i data-lucide="wrench" style="color:var(--red)"></i></div>
      <div><div class="tx-title">Hardware Supplies</div><div class="tx-date">10 Mar, 11:30 AM</div></div></div>
      <div class="tx-amt expense">-$18,500.00</div>
    </div>
  </div>
</div>

<div id="page2" class="page hid">
  <div class="send-card">
    <div class="header"><div class="back" onclick="showPage('page1')"><i data-lucide="arrow-left"></i></div><h2>Send Money</h2></div>
    <button class="send-btn" onclick="alert('Transfer Sent!');showPage('page1')">Send Now</button>
  </div>
</div>

<script>
lucide.createIcons();
function showPage(id){
  document.getElementById('page1').classList.add('hid');
  document.getElementById('page2').classList.add('hid');
  document.getElementById(id).classList.remove('hid');
}
</script>
</body>
</html>
