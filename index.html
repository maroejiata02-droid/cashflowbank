<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITI BANK</title>
<style>
body{margin:0;font-family:Arial;background:#0d1117;color:#fff}
.nav{background:#161b22;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.container{max-width:480px;margin:0 auto;padding:20px}
h1{text-align:center;font-size:20px;margin:20px 0}
.blue{color:#3b82f6;text-align:center;font-weight:700;margin-bottom:20px}
label{color:#8b949e;font-size:13px;margin-bottom:5px;display:block}
input{width:100%;padding:14px;background:#161b22;border:1px solid #30363d;border-radius:8px;color:#fff;margin-bottom:16px;font-size:15px}
.btn{width:100%;padding:14px;background:#2563eb;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-bottom:10px}
.btn2{width:100%;padding:14px;background:#21262d;border:none;border-radius:8px;color:#aaa;font-weight:700;cursor:pointer}
.page{display:none}
</style>
</head>
<body>

<!-- TRANSFER PAGE LIKE YOUR SCREENSHOT -->
<div id="t" class="page" style="display:block">
  <div class="nav"><div>☰</div><div>CITI BANK</div><div>👤</div></div>
  <div class="container">
    <h1>CITI BANK Online<br>Banking Transfer.</h1>
    
    <label>Amount to Transfer (USD):</label>
    <input id="tamt" type="number" placeholder="Enter amount">
    
    <label>Bank name:</label>
    <input id="bn" placeholder="Citi Bank">
    
    <label>Account Number:</label>
    <input id="an" placeholder="1234567890">
    
    <label>Account holder:</label>
    <input id="ah" placeholder="Carson">
    
    <label>Description:</label>
    <input id="ds" placeholder="Payment for...">
    
    <button class="btn" onclick="send()">Continue to next step</button>
    <button class="btn2" onclick="alert('Back')">Back</button>
  </div>
</div>

<script>
function send(){
  let amt = document.getElementById('tamt').value;
  let bn = document.getElementById('bn').value;
  let an = document.getElementById('an').value;
  let ah = document.getElementById('ah').value;
  
  if(!amt || amt <= 0){alert('Please enter amount');return}
  if(!bn || !an || !ah){alert('Please fill all fields');return}
  
  alert('Transfer of USD '+parseInt(amt).toLocaleString()+' to '+ah+' successful!');
  document.getElementById('tamt').value='';
}
</script>
</body>
</html>
