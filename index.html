<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --purpleBtn:#7c3aed; 
  --greenBtn:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}
.dashboard{padding:20px;max-width:500px;margin:0 auto;padding-bottom:100px}
.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:14px 0;text-align:center;cursor:pointer}
.transfer-page{background:rgba(255,255,255,0.95);color:#111;border-radius:20px;padding:24px}
.input-group{margin-bottom:16px}
.input-group input{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px}
.btn-purple{width:100%;padding:14px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}

/* NEW REALISTIC SUCCESS MODAL */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(5px)}
.modal-receipt{background:#fff;color:#111;width:90%;max-width:400px;border-radius:20px;padding:24px;text-align:center;animation:pop 0.3s ease}
@keyframes pop {0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1}}
.success-icon{width:70px;height:70px;background:var(--greenBtn);border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.success-icon svg{width:40px;height:40px;color:#fff}
.receipt-title{font-size:20px;font-weight:800;margin-bottom:8px}
.receipt-amount{font-size:28px;font-weight:800;color:var(--greenBtn);margin-bottom:20px}
.receipt-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6;font-size:14px}
.receipt-row:last-child{border:none}
.btn-close{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:16px;cursor:pointer}
</style>
</head>
<body>

<!-- DASHBOARD -->
<div id="dash" class="dashboard">
  <div class="balance-card">
    <small>Available Balance</small>
    <h1 id="bal">$3,501,439.22</h1>
  </div>

  <div class="actions">
    <div class="action" onclick="show('transfer')"><i data-lucide="send"></i><br><span>Send</span></div>
    <div class="action"><i data-lucide="download"></i><br><span>Request</span></div>
    <div class="action"><i data-lucide="credit-card"></i><br><span>TopUp</span></div>
    <div class="action"><i data-lucide="grid-3x3"></i><br><span>More</span></div>
  </div>

  <div id="txList"></div>
</div>

<!-- TRANSFER PAGE -->
<div id="transfer" class="dashboard hid">
  <button onclick="show('dash')" style="background:none;border:none;color:#fff;margin-bottom:16px">← Back</button>
  <div class="transfer-page">
    <h2 style="margin-bottom:20px;text-align:center">Send Money</h2>
    <div class="input-group"><label>Recipient Name</label><input id="accName" type="text" placeholder="Michael Brown"></div>
    <div class="input-group"><label>Amount ($)</label><input id="amount" type="number" placeholder="5250"></div>
    <div class="input-group"><label>Enter PIN</label><input id="pin" type="password" placeholder="1234" maxlength="4"></div>
    <button class="btn-purple" onclick="sendMoney()">Send Now</button>
  </div>
</div>

<!-- NEW SUCCESS RECEIPT MODAL -->
<div id="successModal" class="modal-overlay hid">
  <div class="modal-receipt">
    <div class="success-icon"><i data-lucide="check"></i></div>
    <div class="receipt-title">Transfer Successful</div>
    <div class="receipt-amount" id="successAmount">$5,250.00</div>
    
    <div class="receipt-row"><span>To</span><span id="successName">Michael Brown</span></div>
    <div class="receipt-row"><span>Amount</span><span id="successAmt2">$5,250.00</span></div>
    <div class="receipt-row"><span>Date</span><span id="successDate">Just now</span></div>
    <div class="receipt-row"><span>Ref</span><span>CFX98231XX</span></div>
    <div class="receipt-row"><span>Status</span><span style="color:var(--greenBtn);font-weight:700">Completed</span></div>
    
    <button class="btn-close" onclick="closeSuccess()">Done</button>
  </div>
</div>

<script>
lucide.createIcons();

let txs = [
  {name:"Salary Credit", icon:"banknote", amt:2000000.00, date:"Today, 09:15 AM"},
  {name:"Client Payment", icon:"arrow-down-left", amt:1500000.00, date:"14 Mar, 11:45 AM"},
  {name:"Internet Bill", icon:"wifi", amt:-500.78, date:"Yesterday, 8:30 PM"}
];
let balance = 3501439.22;

function show(id){
  ['dash','transfer'].forEach(x=>document.getElementById(x).classList.add('hid'));
  document.getElementById(id).classList.remove('hid');
  loadTx();
}

function loadTx(){
  let html = '';
  txs.slice(0,3).forEach(t=> {
    let type = t.amt > 0 ? 'in' : 'out';
    html += `<div style="background:rgba(255,255,255,0.15);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between">
      <div><b>${t.name}</b><br><small>${t.date}</small></div>
      <div class="${type}">${t.amt > 0 ? '+' : '-'}$${Math.abs(t.amt).toLocaleString(undefined,{minimumFractionDigits:2})}</div>
    </div>`;
  });
  document.getElementById('txList').innerHTML = html;
  document.getElementById('bal').innerText = '$' + balance.toLocaleString(undefined,{minimumFractionDigits:2});
  lucide.createIcons();
}

function sendMoney(){
  let name = document.getElementById('accName').value;
  let amt = parseFloat(document.getElementById('amount').value);
  let pin = document.getElementById('pin').value;

  if(!name || !amt || pin !== "1234"){alert('Check details. PIN: 1234');return}
  if(amt > balance){alert('Insufficient Balance');return}

  balance -= amt;
  
  // Add to transaction history
  txs.unshift({name: `Transfer to ${name}`, icon: "send", amt: -amt, date: "Just now"});

  // SHOW REALISTIC MODAL INSTEAD OF ALERT
  document.getElementById('successAmount').innerText = '$' + amt.toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('successAmt2').innerText = '$' + amt.toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('successName').innerText = name;
  document.getElementById('successDate').innerText = new Date().toLocaleString();
  document.getElementById('successModal').classList.remove('hid');
}

function closeSuccess(){
  document.getElementById('successModal').classList.add('hid');
  // Clear form
  document.getElementById('accName').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('pin').value = '';
  show('dash');
}

loadTx();
</script>
</body>
</html>
