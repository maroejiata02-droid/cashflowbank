<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--green1:#6e8b3d; --purple2:#2b1055; --purpleBtn:#7c3aed; --green:#22c55e; --red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.page{padding:20px;max-width:500px;margin:0 auto;animation:fadeIn 0.5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hid{display:none!important}

/* WELCOME + AUTH + DASHBOARD SAME AS BEFORE */
.welcome-page{display:flex;flex-direction:column;justify-content:space-between;height:100vh;text-align:center;padding:40px 20px}
.welcome-logo{font-size:52px;font-weight:900;margin-bottom:8px;background:linear-gradient(90deg,#fff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.feature{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.1);padding:14px;border-radius:12px;margin-bottom:10px;text-align:left;font-size:14px}
.btn-primary{width:100%;padding:16px;background:#fff;border:none;border-radius:12px;color:var(--purple2);font-weight:800;font-size:16px;cursor:pointer}
.btn-outline{width:100%;padding:16px;background:transparent;border:2px solid #fff;border-radius:12px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}

.auth-box{background:rgba(255,255,255,0.15);backdrop-filter:blur(20px);border-radius:24px;padding:32px;border:1px solid rgba(255,255,255,0.2);margin-top:60px}
.input{width:100%;padding:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;margin-bottom:12px}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:8px}

.balance-card{background:linear-gradient(135deg, var(--purpleBtn) 0%, #a855f7 100%);border-radius:24px;padding:28px;margin-bottom:24px;box-shadow:0 10px 40px rgba(124,58,237,0.3)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}

/* SEND MONEY PAGE - NEW REALISTIC DESIGN */
.send-container{padding-top:20px}
.send-card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  border-radius:24px;
  padding:24px;
  border:1px solid rgba(255,255,255,0.2);
  margin-top:20px
}
.back-btn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:20px}
.send-title{font-size:28px;font-weight:900;margin-bottom:8px}
.send-balance{font-size:24px;font-weight:800;margin-bottom:24px}
.input-group{margin-bottom:16px}
.input-field{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:14px;
  padding:16px;
  font-size:15px;
  color:#fff;
  width:100%
}
.input-field::placeholder{color:rgba(255,255,255,0.5)}
.send-btn{
  width:100%;
  padding:18px;
  background:linear-gradient(90deg,#7c3aed,#a855f7);
  border:none;
  border-radius:14px;
  color:#fff;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  margin-top:8px;
  box-shadow:0 8px 20px rgba(124,58,237,0.4)
}
</style>
</head>
<body>

<!-- PAGE 0,1,2,3 SAME AS BEFORE... -->

<!-- PAGE 4: SEND MONEY - REALISTIC LIKE SCREENSHOT -->
<div id="page4" class="page hid">
  <div class="send-container">
    <div class="back-btn" onclick="showPage('page3')">
      <i data-lucide="arrow-left"></i> Back
    </div>

    <div class="send-card">
      <h1 class="send-title">Send Money</h1>
      <h2 class="send-balance" id="balance2">$3,501,439.22</h2>

      <div class="input-group">
        <input class="input-field" type="text" id="recipient" placeholder="Recipient Name">
      </div>

      <div class="input-group">
        <input class="input-field" type="number" id="amount" placeholder="Amount">
      </div>

      <button class="send-btn" onclick="sendMoney()">Send Now</button>
    </div>
  </div>
</div>

<script>
lucide.createIcons();
document.querySelectorAll('.page').forEach(page => { page.classList.add('hid'); });

let balance = localStorage.getItem('cashflow_balance')? parseFloat(localStorage.getItem('cashflow_balance')) : 3501439.22;
let transactions = localStorage.getItem('cashflow_tx')? JSON.parse(localStorage.getItem('cashflow_tx')) : [
  {name: "Welcome Bonus", date: "Today, 09:15 AM", amount: 2000000, type: "income", icon: "gift"}
];

if(localStorage.getItem('cashflow_user')){
  const name = localStorage.getItem('cashflow_user');
  showPage('page3'); renderHistory();
} else { showPage('page0'); }

function formatMoney(num){ return "$" + num.toLocaleString('en-US', {minimumFractionDigits: 2}); }
function saveData(){ localStorage.setItem('cashflow_balance', balance); localStorage.setItem('cashflow_tx', JSON.stringify(transactions)); }

function register(){
  const name = document.getElementById('regName').value;
  localStorage.clear(); localStorage.setItem('cashflow_user', name);
  balance = 3501439.22; saveData();
  showPage('page3'); renderHistory();
}

function login(){
  const name = document.getElementById('email').value.split('@')[0];
  localStorage.setItem('cashflow_user', name);
  showPage('page3'); renderHistory();
}

function logout(){ localStorage.removeItem('cashflow_user'); showPage('page0'); }

function renderHistory(){
  document.getElementById('balance').innerText = formatMoney(balance);
  document.getElementById('balance2').innerText = formatMoney(balance);
}

function sendMoney(){
  const recipient = document.getElementById('recipient').value;
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount || amount <= 0){ alert("Enter valid amount!"); return; }
  if(amount > balance){ alert("Insufficient Balance!"); return; }
  balance = balance - amount;
  transactions.unshift({name: `Transfer to ${recipient}`, date: `Today, ${new Date().toLocaleTimeString()}`, amount: amount, type: "expense", icon: "send"});
  saveData(); renderHistory(); alert(`$${amount.toLocaleString()} Sent to ${recipient} successfully!`); showPage('page3');
}

function showPage(id){ document.querySelectorAll('.page').forEach(page => { page.classList.add('hid'); }); document.getElementById(id).classList.remove('hid'); }
</script>
</body>
</html>
