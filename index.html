<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --purpleBtn:#7c3aed; 
  --purpleBtn2:#a855f7; 
  --greenBtn:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}
.center{ display:flex; justify-content:center; align-items:center; padding:20px; min-height:100vh }

/* AUTH - SMALL */
.auth-card{background:#fff;color:#111;border-radius:20px;padding:28px;max-width:400px;width:100%}

/* DASHBOARD */
.dashboard{padding:20px;max-width:500px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h2{font-size:24px;font-weight:800}
.topbar p{font-size:13px;opacity:0.8}
.logout{background:rgba(255,255,255,0.2);border:none;padding:8px 16px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}

.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.balance-card small{font-size:13px;opacity:0.8}
.balance-card h1{font-size:32px;font-weight:800;margin-top:4px}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:14px 0;text-align:center;cursor:pointer}
.action-icon{width:32px;height:32px;margin:0 auto 6px}
.action span{font-size:12px;font-weight:500}

/* REALISTIC TRANSACTION HISTORY */
.tx-section{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:16px}
.tx-header{font-size:16px;font-weight:700;margin-bottom:14px}
.tx-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.tx-item:last-child{border:none}
.tx-left{display:flex;align-items:center;gap:12px}
.tx-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center}
.tx-icon svg{width:20px;height:20px}
.tx-info b{display:block;font-size:14px}
.tx-info small{font-size:11px;opacity:0.7}
.tx-right{text-align:right}
.tx-amount{font-weight:700;font-size:14px}
.tx-amount.in{color:var(--greenBtn)}
.tx-amount.out{color:var(--red)}
.tx-status{font-size:10px;background:var(--greenBtn);padding:2px 6px;border-radius:6px;margin-top:2px;display:inline-block}
</style>
</head>
<body>

<!-- DASHBOARD ONLY - COPY THE REST FROM PREVIOUS CODE -->
<div id="dash" class="dashboard">
  <div class="topbar">
    <div>
      <h2 id="dashName">Hello Sun</h2>
      <p>Let's save your money</p>
    </div>
    <button class="logout" onclick="alert('Logged out')">Logout</button>
  </div>

  <div class="balance-card">
    <small>Available Balance</small>
    <h1 id="bal">$8,182.80</h1>
  </div>

  <div class="actions">
    <div class="action"><div class="action-icon"><i data-lucide="send"></i></div><span>Send</span></div>
    <div class="action"><div class="action-icon"><i data-lucide="download"></i></div><span>Request</span></div>
    <div class="action"><div class="action-icon"><i data-lucide="credit-card"></i></div><span>TopUp</span></div>
    <div class="action"><div class="action-icon"><i data-lucide="grid-3x3"></i></div><span>More</span></div>
  </div>

  <!-- REALISTIC TRANSACTION HISTORY -->
  <div class="tx-section">
    <div class="tx-header">Recent Transactions</div>
    <div id="txList"></div>
  </div>
</div>

<script>
lucide.createIcons();

let txs = [
  {name:"House Rent", icon:"home", amt:-300.00, date:"Today, 10:00 AM", status:"Completed"},
  {name:"Salary Credit", icon:"banknote", amt:2500.00, date:"Today, 09:15 AM", status:"Completed"},
  {name:"Internet Bill", icon:"wifi", amt:-85.00, date:"Yesterday, 8:30 PM", status:"Completed"},
  {name:"Groceries", icon:"shopping-cart", amt:-240.00, date:"Yesterday, 2:10 PM", status:"Completed"},
  {name:"Client Payment", icon:"arrow-down-left", amt:500.00, date:"14 Mar, 11:45 AM", status:"Completed"},
  {name:"Transport", icon:"bus", amt:-120.00, date:"14 Mar, 08:00 AM", status:"Completed"},
  {name:"Coffee", icon:"coffee", amt:-24.90, date:"13 Mar, 4:20 PM", status:"Completed"},
  {name:"Refund", icon:"rotate-ccw", amt:50.00, date:"13 Mar, 1:00 PM", status:"Completed"}
];

function loadTx(){
  let html = '';
  txs.forEach(t=> {
    let type = t.amt > 0 ? 'in' : 'out';
    html += `<div class="tx-item">
      <div class="tx-left">
        <div class="tx-icon"><i data-lucide="${t.icon}"></i></div>
        <div class="tx-info">
          <b>${t.name}</b>
          <small>${t.date}</small>
        </div>
      </div>
      <div class="tx-right">
        <div class="tx-amount ${type}">${t.amt > 0 ? '+' : ''}$${Math.abs(t.amt).toFixed(2)}</div>
        <span class="tx-status">${t.status}</span>
      </div>
    </div>`;
  });
  document.getElementById('txList').innerHTML = html;
  lucide.createIcons();
}
loadTx();
</script>
</body>
</html>
