<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #6e8b3d, #2b1055);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.login-form {
  background: #ffffff;
  padding: 32px;
  border-radius: 20px;
  max-width: 420px;
  width: 90%;
  border: 1px solid #e0e0e7;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.form-title {
  font-size: 28px;
  font-weight: 700;
  color: #111827;
  margin-bottom: 8px;
}

.form-subtitle {
  font-size: 14px;
  color: #6b7280;
  margin-bottom: 24px;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}

.input-wrap {
  position: relative;
}

.form-input {
  width: 100%;
  padding: 12px 40px 12px 40px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 14px;
  background: #fff;
}

.form-input:focus {
  border-color: #7c3aed;
  box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  outline: none;
}

.input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.eye-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
  cursor: pointer;
}

.submit-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(90deg, #7c3aed, #a855f7);
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 700;
  margin-top: 10px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
}
</style>
</head>
<body>

<form class="login-form" onsubmit="event.preventDefault(); alert('Login Successful!')">
  <h2 class="form-title">Login</h2>
  <p class="form-subtitle">Welcome back! Login to your account.</p>

  <div class="form-group">
    <label class="form-label">Full Name</label>
    <div class="input-wrap">
      <span class="input-icon">👤</span>
      <input type="text" class="form-input" placeholder="John Doe" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-wrap">
      <span class="input-icon">✉️</span>
      <input type="email" class="form-input" placeholder="john@example.com" required>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" class="form-input" placeholder="••••" required>
      <span class="eye-icon">👁️</span>
    </div>
  </div>

  <button type="submit" class="submit-btn">Login</button>
</form>

</body>
</html>
