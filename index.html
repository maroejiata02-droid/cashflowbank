<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --purpleBtn:#7c3aed; 
  --purpleBtn2:#a855f7;
  --greenBtn:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}

/* DASHBOARD */
.dashboard{padding:20px;max-width:500px;margin:0 auto}
.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:14px 0;text-align:center;cursor:pointer}

/* SEND MONEY - GLASS CARD */
.send-card{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  color:#fff;
  border-radius:24px;
  padding:24px;
  border:1px solid rgba(255,255,255,0.2)
}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-arrow{cursor:pointer;padding:8px;border-radius:10px}
.back-arrow:hover{background:rgba(255,255,255,0.1)}
.balance-preview{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:16px;padding:16px;margin-bottom:20px}
.input-box{position:relative;margin-bottom:16px}
.input-box input{
  width:100%;padding:14px 14px 14px 44px;
  background:rgba(255,255,255,0.1);
  border:1.5px solid rgba(255,255,255,0.3);
  border-radius:12px;font-size:15px;color:#fff
}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#fff;width:20px;height:20px}
.fee-box{background:rgba(255,255,255,0.1);border-radius:12px;padding:12px;margin:16px 0}
.btn-purple{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),var(--purpleBtn2));color:#fff;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<!-- 1. DASHBOARD -->
<div id="dash" class="dashboard">
  <div class="balance-card">
    <small>Available Balance</small>
    <h1>$3,501,439.22</h1>
  </div>
  <div class="actions">
    <div class="action" onclick="show('transfer')"><i data-lucide="send"></i><br><span>Send</span></div>
  </div>
</div>

<!-- 2. SEND MONEY -->
<div id="transfer" class="dashboard hid">
  <div class="send-card">
    <div class="header">
      <!-- FIX: ADDED onclick="show('dash')" BACK -->
      <div class="back-arrow" onclick="show('dash')">
        <i data-lucide="arrow-left"></i>
      </div>
      <h2>Send Money</h2>
    </div>

    <div class="balance-preview">
      <small>Available Balance</small>
      <h3>$3,501,439.22</h3>
    </div>

    <label>Recipient Name</label>
    <div class="input-box">
      <i data-lucide="user" class="input-icon"></i>
      <input type="text" value="Michael Brown">
    </div>

    <label>Account Number</label>
    <div class="input-box">
      <i data-lucide="credit-card" class="input-icon"></i>
      <input type="text" value="0123456789">
    </div>

    <label>Amount ($)</label>
    <div class="input-box">
      <i data-lucide="dollar-sign" class="input-icon"></i>
      <input type="number" value="0.00">
    </div>

    <div class="fee-box">
      <div style="display:flex;justify-content:space-between"><span>Amount</span><span>$0.00</span></div>
      <div style="display:flex;justify-content:space-between"><span>Transfer Fee</span><span>$0.00</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total Debit</span><span>$0.00</span></div>
    </div>

    <button class="btn-purple">Send Now</button>
  </div>
</div>

<script>
lucide.createIcons();

// FIX: FULL SHOW FUNCTION TO SWITCH PAGES
function show(id){
  document.getElementById('dash').classList.add('hid');
  document.getElementById('transfer').classList.add('hid');
  document.getElementById(id).classList.remove('hid');
}
</script>
</body>
</html>
