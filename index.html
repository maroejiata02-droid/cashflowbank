<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; --purple2:#2b1055; --purpleBtn:#7c3aed;
  --green:#22c55e; --red:#ef4444; --bg1:#6e8b3d; --bg2:#2b1055;
  --text:#fff; --card:rgba(255,255,255,0.15);
}
[data-theme="light"]{
  --bg1:#e0e7ff; --bg2:#c7d2fe; --text:#111; --card:rgba(0,0,0,0.05);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);min-height:100vh;color:var(--text);transition:0.3s}
.page{padding:20px;max-width:500px;margin:0 auto;animation:fadeIn 0.5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hid{display:none!important}

/* WELCOME */
.welcome-page{display:flex;flex-direction:column;justify-content:space-between;height:100vh;text-align:center;padding:40px 20px}
.welcome-logo{font-size:52px;font-weight:900;margin-bottom:16px;background:linear-gradient(90deg,#a855f7,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.feature{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:12px;margin-bottom:10px;text-align:left}
.btn-primary{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn-outline{width:100%;padding:16px;background:transparent;border:2px solid var(--text);border-radius:12px;color:var(--text);font-weight:700;font-size:16px;cursor:pointer;opacity:0.8}

/* CARDS */
.auth-box,.balance-card,.send-card{background:var(--card);backdrop-filter:blur(10px);border-radius:24px;padding:24px;border:1px solid rgba(255,255,255,0.1)}
.input{width:100%;padding:14px;background:var(--card);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:var(--text);margin-bottom:12px}
.input::placeholder{color:rgba(128,128,128,0.7)}
.btn{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px;cursor:pointer}

/* DASHBOARD */
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.action{background:var(--card);border-radius:16px;padding:16px 0;text-align:center;cursor:pointer;font-size:13px;font-weight:600}
.history-box{max-height:320px; overflow-y:auto}
.tx-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.tx-amt{font-weight:800;font-size:15px}
.income{color:var(--green)}.expense{color:var(--red)}
.theme-btn{padding:8px 12px;background:var(--card);border-radius:8px;cursor:pointer}

/* MODAL */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--bg2);padding:24px;border-radius:20px;width:90%;max-width:400px;color:var(--text)}
</style>
</head>
<body>

<!-- PAGE 0: WELCOME -->
<div id="page0" class="page welcome-page">
  <div>
    <div class="welcome-logo">CASHFLOW</div>
    <div class="feature"><i data-lucide="shield-check"></i> <b>Safe & Secure</b></div>
    <div class="feature"><i data-lucide="zap"></i> <b>Instant Transfers</b></div>
  </div>
  <div>
    <button class="btn-primary" onclick="showPage('page1')">Create Account</button>
    <button class="btn-outline" onclick="showPage('page2')" style="margin-top:12px">Login</button>
  </div>
</div>

<!-- PAGE 1: REGISTER -->
<div id="page1" class="page hid">
  <div class="auth-box">
    <div onclick="showPage('page0')" style="margin-bottom:16px;cursor:pointer"><i data-lucide="arrow-left"></i></div>
    <h2>Create Account</h2>
    <input class="input" type="text" id="regName" placeholder="Full Name">
    <input class="input" type="email" id="regEmail" placeholder="Email">
    <input class="input" type="password" id="regPassword" placeholder="Password">
    <button class="btn" onclick="register()">Create Account</button>
  </div>
</div>

<!-- PAGE 2: LOGIN -->
<div id="page2" class="page hid">
  <div class="auth-box">
    <div onclick="showPage('page0')" style="margin-bottom:16px;cursor:pointer"><i data-lucide="arrow-left"></i></div>
    <h2>Login</h2>
    <input class="input" type="email" id="email" value="john@email.com">
    <input class="input" type="password" id="password" value="123456">
    <button class="btn" onclick="login()">Login</button>
  </div>
</div>

<!-- PAGE 3: DASHBOARD -->
<div id="page3" class="page hid">
  <div class="topbar">
    <div><h2 id="greeting">Hello 👋</h2></div>
    <div style="display:flex;gap:8px">
      <div class="theme-btn" onclick="toggleTheme()"><i data-lucide="sun-moon"></i></div>
      <div class="theme-btn" onclick="logout()">Logout</div>
    </div>
  </div>

  <div class="balance-card">
    <small>Available Balance</small>
    <h1 id="balance">$3,501,439.22</h1>
    <button onclick="resetBalance()" style="margin-top:12px;padding:10px;width:100%;background:var(--red);border:none;border-radius:10px;color:#fff">🔄 Reset</button>
  </div>

  <div class="actions">
    <div class="action" onclick="showPage('page4')"><i data-lucide="send"></i><br>Send</div>
  </div>

  <h3>Transaction History</h3>
  <div class="history-box" id="history"></div>
</div>

<!-- PAGE 4: SEND -->
<div id="page4" class="page hid">
  <div class="send-card">
    <div onclick="showPage('page3')" style="margin-bottom:16px;cursor:pointer"><i data-lucide="arrow-left"></i></div>
    <h2>Send Money</h2>
    <h3 id="balance2">$3,501,439.22</h3>
    <input class="input" type="text" id="recipient" placeholder="Recipient">
    <input class="input" type="number" id="amount" placeholder="Amount">
    <button class="btn" onclick="sendMoney()">Send Now</button>
  </div>
</div>

<!-- MODAL -->
<div id="detailModal" class="modal hid">
  <div class="modal-box">
    <h2>Transaction Details</h2>
    <div id="detailContent"></div>
    <button class="btn" onclick="closeModal()" style="margin-top:16px">Close</button>
  </div>
</div>

<script>
lucide.createIcons();

// LOAD THEME
if(localStorage.getItem('theme')) document.body.setAttribute('data-theme', localStorage.getItem('theme'));
document.querySelectorAll('.page').forEach(p=>p.classList.add('hid'));

let balance = localStorage.getItem('cashflow_balance')? parseFloat(localStorage.getItem('cashflow_balance')) : 3501439.22;
let transactions = localStorage.getItem('cashflow_tx')? JSON.parse(localStorage.getItem('cashflow_tx')) : [
  {id:1, name:"Salary Credit", date:"Today, 09:15 AM", amount:2000000, type:"income", icon:"briefcase", status:"Completed", ref:"TXN12345"}
];

if(localStorage.getItem('cashflow_user')){
  document.getElementById('greeting').innerText = `Hello, ${localStorage.getItem('cashflow_user')} 👋`;
  showPage('page3'); renderHistory();
} else { showPage('page0'); }

function formatMoney(n){ return "$" + n.toLocaleString('en-US',{minimumFractionDigits:2}); }
function saveData(){ localStorage.setItem('cashflow_balance',balance); localStorage.setItem('cashflow_tx',JSON.stringify(transactions)); }

function toggleTheme(){ // FIXED
  const current = document.body.getAttribute('data-theme');
  const newTheme = current === 'light'? 'dark' : 'light';
  document.body.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
}

function showDetails(tx){
  document.getElementById('detailModal').classList.remove('hid');
  document.getElementById('detailContent').innerHTML = `
    <p><b>Type:</b> ${tx.type==='income'?'Received':'Sent'}</p>
    <p><b>Amount:</b> ${formatMoney(tx.amount)}</p>
    <p><b>To/From:</b> ${tx.name}</p>
    <p><b>Date:</b> ${tx.date}</p>
    <p><b>Status:</b> ${tx.status}</p>
    <p><b>Reference:</b> ${tx.ref}</p>
  `;
}
function closeModal(){ document.getElementById('detailModal').classList.add('hid'); }

function renderHistory(){
  document.getElementById('balance').innerText = formatMoney(balance);
  document.getElementById('balance2').innerText = formatMoney(balance);
  const box = document.getElementById('history'); box.innerHTML = "";
  transactions.forEach(tx => {
    box.innerHTML += `
      <div class="tx-item" onclick='showDetails(${JSON.stringify(tx).replace(/"/g, "&quot;")})'>
        <div><b>${tx.name}</b><br><small>${tx.date}</small></div>
        <div class="tx-amt ${tx.type}">${tx.type==='income'?'+':'-'}${formatMoney(tx.amount)}</div>
      </div>
    `;
  });
  lucide.createIcons();
}

function sendMoney(){
  const recipient = document.getElementById('recipient').value;
  const amount = parseFloat(document.getElementById('amount').value);
  if(amount > balance){ alert("Insufficient Balance!"); return; }
  balance -= amount;
  const newTx = {id:Date.now(), name:`Transfer to ${recipient}`, date:`Today, ${new Date().toLocaleTimeString()}`, amount, type:"expense", icon:"send", status:"Completed", ref:"TXN"+Date.now()};
  transactions.unshift(newTx);
  saveData(); renderHistory(); showPage('page3');
}

function register(){ localStorage.setItem('cashflow_user',document.getElementById('regName').value); showPage('page3'); renderHistory(); }
function login(){ localStorage.setItem('cashflow_user',document.getElementById('email').value.split('@')[0]); showPage('page3'); renderHistory(); }
function logout(){ localStorage.removeItem('cashflow_user'); showPage('page0'); }
function resetBalance(){ balance=3501439.22; saveData(); renderHistory(); }
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.add('hid')); document.getElementById(id).classList.remove('hid'); }
</script>
</body>
</html>
