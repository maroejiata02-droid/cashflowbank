<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --purpleBtn:#7c3aed; 
  --purpleBtn2:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}
.dashboard{padding:20px;max-width:500px;margin:0 auto}

/* REALISTIC SEND MONEY CARD */
.send-card{background:#fff;color:#111;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.3)}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.header h2{font-size:20px;font-weight:800}

/* BALANCE PREVIEW */
.balance-preview{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:16px;padding:16px;margin-bottom:20px}
.balance-preview small{opacity:0.8;font-size:12px}
.balance-preview h3{font-size:22px;font-weight:800;margin-top:4px}

/* INPUTS */
.input-group{margin-bottom:16px}
.input-group label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px}
.input-box{position:relative}
.input-box input{width:100%;padding:14px 14px 14px 44px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;font-weight:500}
.input-box input:focus{border-color:var(--purpleBtn);outline:none}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--purpleBtn);width:20px;height:20px}

/* FEE BREAKDOWN */
.fee-box{background:#f9fafb;border-radius:12px;padding:12px;margin:16px 0}
.fee-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.fee-row.total{font-weight:700;font-size:14px;border-top:1px solid #e5e7eb;padding-top:8px;margin-top:8px}

/* PIN DOTS */
.pin-dots{display:flex;gap:10px;justify-content:center;margin:16px 0}
.dot{width:14px;height:14px;border:2px solid #d1d5db;border-radius:50%}

/* BUTTON */
.btn-purple{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),var(--purpleBtn2));color:#fff;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-purple:disabled{opacity:0.6;cursor:not-allowed}
</style>
</head>
<body>

<div class="dashboard">
  <div class="send-card">
    <div class="header">
      <i data-lucide="arrow-left" style="cursor:pointer" onclick="alert('Back')"></i>
      <h2>Send Money</h2>
    </div>

    <!-- BALANCE PREVIEW -->
    <div class="balance-preview">
      <small>Available Balance</small>
      <h3 id="bal">$3,501,439.22</h3>
    </div>

    <!-- RECIPIENT -->
    <div class="input-group">
      <label>Recipient Name</label>
      <div class="input-box">
        <i data-lucide="user" class="input-icon"></i>
        <input id="accName" type="text" placeholder="Michael Brown" value="Michael Brown">
      </div>
    </div>

    <div class="input-group">
      <label>Account Number</label>
      <div class="input-box">
        <i data-lucide="credit-card" class="input-icon"></i>
        <input id="accNum" type="text" placeholder="0123456789" maxlength="10">
      </div>
    </div>

    <!-- AMOUNT -->
    <div class="input-group">
      <label>Amount ($)</label>
      <div class="input-box">
        <i data-lucide="dollar-sign" class="input-icon"></i>
        <input id="amount" type="number" placeholder="0.00" value="5250" oninput="calcFee()">
      </div>
    </div>

    <!-- FEE BREAKDOWN -->
    <div class="fee-box">
      <div class="fee-row"><span>Amount</span><span id="feeAmt">$5,250.00</span></div>
      <div class="fee-row"><span>Transfer Fee</span><span id="fee">$10.50</span></div>
      <div class="fee-row total"><span>Total Debit</span><span id="total">$5,260.50</span></div>
    </div>

    <!-- PIN -->
    <div class="input-group">
      <label>Enter 4-Digit PIN</label>
      <div class="pin-dots" id="pinDots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <input id="pin" type="password" maxlength="4" style="opacity:0;height:0" oninput="updateDots()">
    </div>

    <button class="btn-purple" id="sendBtn" onclick="sendMoney()">
      <i data-lucide="send"></i> Send Now
    </button>
  </div>
</div>

<script>
lucide.createIcons();

let balance = 3501439.22;

function calcFee(){
  let amt = parseFloat(document.getElementById('amount').value) || 0;
  let fee = amt * 0.002; // 0.2% fee
  if(fee < 1) fee = 1; // minimum $1
  let total = amt + fee;
  
  document.getElementById('feeAmt').innerText = '$' + amt.toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('fee').innerText = '$' + fee.toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('total').innerText = '$' + total.toLocaleString(undefined,{minimumFractionDigits:2});
}

function updateDots(){
  let pin = document.getElementById('pin').value;
  let dots = document.querySelectorAll('.dot');
  dots.forEach((d,i)=> {
    d.style.background = i < pin.length ? '#7c3aed' : 'transparent';
    d.style.borderColor = i < pin.length ? '#7c3aed' : '#d1d5db';
  })
}

function sendMoney(){
  let btn = document.getElementById('sendBtn');
  let name = document.getElementById('accName').value;
  let acc = document.getElementById('accNum').value;
  let amt = parseFloat(document.getElementById('amount').value);
  let pin = document.getElementById('pin').value;

  if(acc.length !== 10){alert('Enter valid 10 digit account number');return}
  if(!name){alert('Enter recipient name');return}
  if(!amt || amt <= 0){alert('Enter valid amount');return}
  if(pin !== "1234"){alert('Incorrect PIN. Use: 1234');return}

  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Processing...';
  lucide.createIcons();

  setTimeout(()=> {
    alert(`$${amt.toLocaleString()} sent to ${name} successfully!`);
    btn.disabled = false;
    btn.innerHTML = '<i data-lucide="send"></i> Send Now';
    lucide.createIcons();
  }, 2000)
}

calcFee(); // run once on load
</script>
</body>
</html>
