<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --purpleBtn:#7c3aed; 
  --greenBtn:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}
.dashboard{padding:20px;max-width:500px;margin:0 auto;padding-bottom:100px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.balance-card h1{font-size:32px;font-weight:800;margin-top:4px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:14px 0;text-align:center;cursor:pointer}
.tx-section{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:16px}
.tx-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1)}
.tx-left{display:flex;align-items:center;gap:12px}
.tx-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center}
.tx-amount.in{color:var(--greenBtn)}
.tx-amount.out{color:var(--red)}

/* TRANSFER PAGE */
.transfer-page{background:rgba(255,255,255,0.95);color:#111;border-radius:20px;padding:24px}
.input-group{margin-bottom:16px}
.input-group label{font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px}
.input-group input{width:100%;padding:12px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:15px}
.pin-box{display:flex;gap:10px;justify-content:center;margin:20px 0}
.pin-box input{width:50px;height:50px;text-align:center;font-size:20px;border:2px solid #e5e7eb;border-radius:10px}
.btn-purple{width:100%;padding:14px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.back-btn{background:none;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:16px}
</style>
</head>
<body>

<!-- 1. DASHBOARD -->
<div id="dash" class="dashboard">
  <div class="topbar">
    <div>
      <h2>Hello Sun</h2>
      <p style="font-size:13px;opacity:0.8">Let's save your money</p>
    </div>
  </div>

  <div class="balance-card">
    <small>Available Balance</small>
    <h1 id="bal">$3,501,439.22</h1>
  </div>

  <div class="actions">
    <div class="action" onclick="show('transfer')"><i data-lucide="send"></i><br><span>Send</span></div> <!-- NOW WORKING -->
    <div class="action"><i data-lucide="download"></i><br><span>Request</span></div>
    <div class="action"><i data-lucide="credit-card"></i><br><span>TopUp</span></div>
    <div class="action"><i data-lucide="grid-3x3"></i><br><span>More</span></div>
  </div>

  <div class="tx-section">
    <div style="font-weight:700;margin-bottom:14px">Recent Transactions</div>
    <div id="txList"></div>
  </div>
</div>

<!-- 2. TRANSFER PAGE -->
<div id="transfer" class="dashboard hid">
  <button class="back-btn" onclick="show('dash')"><i data-lucide="arrow-left"></i> Back</button>
  <div class="transfer-page">
    <h2 style="margin-bottom:20px;text-align:center">Send Money</h2>
    
    <div class="input-group">
      <label>Recipient Account Number</label>
      <input id="accNum" type="text" placeholder="Enter 10 digit account number" maxlength="10">
    </div>

    <div class="input-group">
      <label>Recipient Name</label>
      <input id="accName" type="text" placeholder="John Doe">
    </div>

    <div class="input-group">
      <label>Amount ($)</label>
      <input id="amount" type="number" placeholder="0.00">
    </div>

    <div class="input-group">
      <label>Enter 4-Digit PIN</label>
      <div class="pin-box">
        <input type="password" maxlength="1" onkeyup="movePin(this,0)">
        <input type="password" maxlength="1" onkeyup="movePin(this,1)">
        <input type="password" maxlength="1" onkeyup="movePin(this,2)">
        <input type="password" maxlength="1" onkeyup="movePin(this,3)">
      </div>
    </div>

    <button class="btn-purple" onclick="sendMoney()">Send Now</button>
  </div>
</div>

<script>
lucide.createIcons();

let txs = [
  {name:"Salary Credit", icon:"banknote", amt:2000000.00, date:"Today, 09:15 AM"},
  {name:"Client Payment", icon:"arrow-down-left", amt:1500000.00, date:"14 Mar, 11:45 AM"},
  {name:"Internet Bill", icon:"wifi", amt:-500.78, date:"Yesterday, 8:30 PM"},
  {name:"Coffee", icon:"coffee", amt:-24.90, date:"13 Mar, 4:20 PM"},
  {name:"Refund", icon:"rotate-ccw", amt:50.00, date:"13 Mar, 1:00 PM"}
];

let balance = 3501439.22;
let correctPin = "1234"; // Default PIN

function show(id){
  ['dash','transfer'].forEach(x=>document.getElementById(x).classList.add('hid'));
  document.getElementById(id).classList.remove('hid');
  loadTx();
}

function movePin(el, index){
  if(el.value.length === 1){
    let next = document.querySelectorAll('.pin-box input')[index+1];
    if(next) next.focus();
  }
}

function loadTx(){
  let html = '';
  txs.slice(0,3).forEach(t=> {
    let type = t.amt > 0 ? 'in' : 'out';
    html += `<div class="tx-item">
      <div class="tx-left">
        <div class="tx-icon"><i data-lucide="${t.icon}"></i></div>
        <div><b>${t.name}</b><br><small style="opacity:0.7">${t.date}</small></div>
      </div>
      <div class="tx-amount ${type}">${t.amt > 0 ? '+' : '-'}$${Math.abs(t.amt).toLocaleString(undefined,{minimumFractionDigits:2})}</div>
    </div>`;
  });
  document.getElementById('txList').innerHTML = html;
  document.getElementById('bal').innerText = '$' + balance.toLocaleString(undefined,{minimumFractionDigits:2});
  lucide.createIcons();
}

function sendMoney(){
  let acc = document.getElementById('accNum').value;
  let name = document.getElementById('accName').value;
  let amt = parseFloat(document.getElementById('amount').value);
  let pin = Array.from(document.querySelectorAll('.pin-box input')).map(i=>i.value).join('');

  if(acc.length !== 10){alert('Enter valid 10 digit account number');return}
  if(!name){alert('Enter recipient name');return}
  if(!amt || amt <= 0){alert('Enter valid amount');return}
  if(pin !== correctPin){alert('Incorrect PIN. Use: 1234');return}
  if(amt > balance){alert('Insufficient Balance');return}

  // Deduct balance
  balance -= amt;
  
  // Add new transaction
  txs.unshift({
    name: `Transfer to ${name}`,
    icon: "send",
    amt: -amt,
    date: "Just now"
  });

  alert(`$${amt.toLocaleString()} sent to ${name} successfully!`);
  
  // Clear form
  document.getElementById('accNum').value = '';
  document.getElementById('accName').value = '';
  document.getElementById('amount').value = '';
  document.querySelectorAll('.pin-box input').forEach(i=>i.value='');

  show('dash');
}

loadTx();
</script>
</body>
</html>
