<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--green1:#6e8b3d; --purple2:#2b1055; --purpleBtn:#7c3aed;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.page{padding:20px;max-width:500px;margin:0 auto}
.hid{display:none}
.card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.btn{background:rgba(255,255,255,0.15);border-radius:16px;padding:16px;text-align:center;cursor:pointer;width:100px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{cursor:pointer;padding:8px;background:rgba(255,255,255,0.1);border-radius:10px}
.input{width:100%;padding:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;margin-bottom:12px}
.send-btn{width:100%;padding:16px;background:linear-gradient(90deg,var(--purpleBtn),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:700}
</style>
</head>
<body>

<!-- PAGE 1: DASHBOARD -->
<div id="page1" class="page">
  <div class="card">
    <small>Available Balance</small>
    <h1>$3,501,439.22</h1>
  </div>
  <!-- INLINE JS HERE SO E NO FAIL -->
  <div class="btn" onclick="document.getElementById('page1').classList.add('hid');document.getElementById('page2').classList.remove('hid')">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    <br>Send
  </div>
</div>

<!-- PAGE 2: SEND MONEY -->
<div id="page2" class="page hid">
  <div style="background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:24px;padding:24px">
    <div class="header">
      <!-- INLINE BACK BUTTON -->
      <div class="back" onclick="document.getElementById('page2').classList.add('hid');document.getElementById('page1').classList.remove('hid')">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </div>
      <h2>Send Money</h2>
    </div>

    <div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:16px;padding:16px;margin-bottom:20px">
      <small>Available Balance</small>
      <h3>$3,501,439.22</h3>
    </div>

    <label>Recipient Name</label>
    <input class="input" type="text" value="Michael Brown">

    <label>Account Number</label>
    <input class="input" type="text" value="0123456789">

    <label>Amount ($)</label>
    <input class="input" type="number" value="5250">

    <button class="send-btn" onclick="alert('Transfer Sent!')">Send Now</button>
  </div>
</div>

<script>
lucide.createIcons(); // only for icons
</script>
</body>
</html>
