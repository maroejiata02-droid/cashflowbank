<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body{background:linear-gradient(180deg,#6e8b3d 0%,#2b1055 100%);min-height:100vh;color:#fff;font-family:Arial;margin:0}
.page{padding:20px;max-width:500px;margin:0 auto}
.hid{display:none}
.btn{width:100%;padding:16px;background:#7c3aed;border:none;border-radius:12px;color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.input{width:100%;padding:14px;background:rgba(255,255,255,0.1);border:1px solid #fff;border-radius:12px;color:#fff;margin-bottom:10px}
.card{background:rgba(255,255,255,0.15);border-radius:20px;padding:20px;margin:20px 0}
</style>
</head>
<body>

<div id="p0" class="page">
<h1 style="text-align:center;font-size:40px">CASHFLOW</h1>
<button class="btn" onclick="go('p1')">Create Account</button>
<button class="btn" onclick="go('p2')" style="background:transparent;border:2px solid #fff">Login</button>
</div>

<div id="p1" class="page hid"><div class="card">
<h2>Create Account</h2>
<input class="input" id="n" placeholder="Full Name">
<input class="input" id="e" placeholder="Email">
<input class="input" id="pw" type="password" placeholder="Password">
<button class="btn" onclick="reg()">Create</button>
</div></div>

<div id="p2" class="page hid"><div class="card">
<h2>Login</h2>
<input class="input" id="em" value="john@email.com">
<input class="input" id="pa" type="password" value="123456">
<button class="btn" onclick="log()">Login</button>
</div></div>

<div id="p3" class="page hid">
<h2 id="gr">Hello</h2>
<div class="card">
<small>Balance</small>
<h1 id="bal">$3,501,439.22</h1>
</div>
<button class="btn" onclick="go('p4')">Send Money</button>
<button class="btn" onclick="out()" style="background:red">Logout</button>
<div id="tx"></div>
</div>

<div id="p4" class="page hid"><div class="card">
<h2>Send Money</h2>
<h3 id="bal2">$3,501,439.22</h3>
<input class="input" id="rec" placeholder="Recipient">
<input class="input" id="amt" type="number" placeholder="Amount">
<button class="btn" onclick="send()">Send Now</button>
</div></div>

<script>
let bal=3501439.22; let tx=[{n:"Bonus",a:2000000,t:"+"}];
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hid'));document.getElementById(id).classList.remove('hid')}
function fmt(x){return "$"+x.toLocaleString()}
function reg(){let name=document.getElementById('n').value;localStorage.setItem('user',name);document.getElementById('gr').innerText="Hello "+name;go('p3');show();}
function log(){let name=document.getElementById('em').value.split('@')[0];localStorage.setItem('user',name);document.getElementById('gr').innerText="Hello "+name;go('p3');show();}
function out(){localStorage.removeItem('user');go('p0')}
function show(){document.getElementById('bal').innerText=fmt(bal);document.getElementById('bal2').innerText=fmt(bal);let d=document.getElementById('tx'); d.innerHTML="";tx.forEach(x=>{d.innerHTML+=`<div class="card">${x.n} <b>${x.t}${fmt(x.a)}</b></div>`})}
function send(){let r=document.getElementById('rec').value;let a=parseFloat(document.getElementById('amt').value);if(a>bal){alert("No money")}else{bal=bal-a; tx.unshift({n:"To "+r,a:a,t:"-"});show(); alert("Sent!"); go('p3');}}
if(localStorage.getItem('user')){document.getElementById('gr').innerText="Hello "+localStorage.getItem('user');go('p3');show();}
</script>
</body>
</html>
