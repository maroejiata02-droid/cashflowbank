<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITI BANK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0047AB;color:white}

.nav{background:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900;color:#0047AB;display:flex;align-items:center;gap:8px}
.logo::before{content:"🏦";font-size:26px}
.btn{padding:10px 20px;border:none;border-radius:25px;font-weight:600;cursor:pointer;background:#0047AB;color:white}
.btn-white{padding:8px 18px;background:white;color:#0047AB;border:2px solid #0047AB;border-radius:25px;font-weight:600;cursor:pointer;margin-right:10px}

.hero{padding:50px 20px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:40px;line-height:1.2;margin:15px 0}
.hero p{color:#D6E7FF;font-size:16px;margin-bottom:25px}
.trust{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.avatars img{width:35px;height:35px;border-radius:50%;border:2px solid white;margin-left:-10px}
.stars{color:#FFD700}

.phone{background:#000;border-radius:35px;padding:10px}
.phone-screen{background:white;border-radius:25px;width:270px;height:500px;color:#222}
.phone-top{background:#0047AB;color:white;padding:14px;text-align:center;font-weight:700}
.bal{background:#0047AB;margin:15px;border-radius:15px;padding:18px;color:white}

@media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center}}
</style>
</head>
<body>

<div class="nav">
  <div class="logo">CITI BANK</div>
  <div>
    <button class="btn-white" onclick="alert('Signup coming next')">Create Account</button>
    <button class="btn" onclick="alert('Login coming next')">Login</button>
  </div>
</div>

<div class="hero">
  <div>
    <div class="trust">
      <div class="avatars">
        <img src="https://i.pravatar.cc/35?1">
        <img src="https://i.pravatar.cc/35?2">
      </div>
      <div>
        <div class="stars">★★★</div>
        <div>Trusted by <b>50,000+</b> customers</div>
      </div>
    </div>
    <h1>Your<br>Money.<br>Your<br>Bank.<br>Anywhere.</h1>
    <p>Send, receive and manage your funds globally in seconds.</p>
    <button class="btn" style="background:white;color:#0047AB;padding:14px 28px" onclick="alert('Signup coming next')">Start Banking Free</button>
  </div>
  
  <div style="display:flex;justify-content:center">
    <div class="phone">
      <div class="phone-screen">
        <div class="phone-top">CITI BANK</div>
        <div class="bal">
          <small>Available Balance</small>
          <div><b>USD 8,360,200</b></div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
