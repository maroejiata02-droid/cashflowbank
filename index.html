<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--bg:#0a0a0a; --card:#1a1a1a; --card2:#222; --purple:#7c3aed; --green:#22c55e; --red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg,#0a0a0a 0%,#1a1a1a 100%);min-height:100vh;color:#fff}
.page{max-width:500px;margin:0 auto;animation:fadeIn 0.5s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.hid{display:none!important}

/* DASHBOARD - PREMIUM */
.dashboard{padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.greet h2{font-size:24px;font-weight:800;text-transform:capitalize}
.greet small{opacity:0.7;font-size:13px}
.logout-btn{padding:10px 16px;background:var(--card);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #333}

.balance-card{
  background:linear-gradient(135deg, var(--purple) 0%, #a855f7 100%);
  border-radius:24px;
  padding:28px;
  margin-bottom:24px;
  box-shadow:0 10px 40px rgba(124,58,237,0.3)
}
.balance-label{font-size:13px;opacity:0.9;margin-bottom:8px}
.balance-amount{font-size:36px;font-weight:900;margin-bottom:12px}
.balance-footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:0.9}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.action{
  background:var(--card);
  border-radius:18px;
  padding:18px 0;
  text-align:center;
  cursor:pointer;
  border:1px solid #333;
  transition:all 0.2s
}
.action:hover{transform:translateY(-2px);background:var(--card2)}
.action i{margin-bottom:8px;color:var(--purple)}
.action span{font-size:12px;font-weight:600}

.section-title{font-size:18px;font-weight:800;margin-bottom:16px;padding:0 4px}
.history-box{max-height:380px;overflow-y:auto}
.tx-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--card);
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  border:1px solid #333
}
.tx-left{display:flex;gap:12px;align-items:center}
.tx-icon{
  width:42px;height:42px;border-radius:12px;
  background:#2a2a2a;
  display:flex;align-items:center;justify-content:center
}
.tx-name{font-weight:700;font-size:14px}
.tx-date{font-size:12px;opacity:0.6}
.tx-amt{font-weight:800;font-size:15px}
.income{color:var(--green)}
.expense{color:var(--red)}

/* OTHER PAGES */
.welcome-page{padding:20px}
.card{background:var(--card);border-radius:20px;padding:24px;margin-bottom:20px}
.btn-primary{width:100%;padding:16px;background:linear-gradient(90deg,var(--purple),#a855f7);border:none;border-radius:12px;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<!-- PAGE 0: WELCOME -->
<div id="page0" class="page welcome-page">
  <h1 style="text-align:center;font-size:40px;font-weight:900;margin:40px 0;background:linear-gradient(90deg,#fff,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">CASHFLOW</h1>
  <div class="card">
    <h2>Global Banking, African Excellence</h2>
    <p style="opacity:0.7;margin:12px 0">Bank smarter, send money instantly</p>
  </div>
  <button class="btn-primary" onclick="showPage('page1')">Create Account</button>
  <button class="btn-primary" onclick="showPage('page2')" style="background:#333;margin-top:12px">Login</button>
</div>

<!-- PAGE 1: REGISTER -->
<div id="page1" class="page hid" style="padding:20px">
  <div onclick="showPage('page0')" style="margin-bottom:20px;cursor:pointer"><i data-lucide="arrow-left"></i> Back</div>
  <div class="card">
    <h2>Create Account</h2>
    <input id="regName" placeholder="Full Name" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <input id="regEmail" placeholder="Email" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <input id="regPassword" type="password" placeholder="Password" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <button class="btn-primary" onclick="register()">Create Account</button>
  </div>
</div>

<!-- PAGE 2: LOGIN -->
<div id="page2" class="page hid" style="padding:20px">
  <div onclick="showPage('page0')" style="margin-bottom:20px;cursor:pointer"><i data-lucide="arrow-left"></i> Back</div>
  <div class="card">
    <h2>Login</h2>
    <input id="email" value="john@email.com" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <input id="password" type="password" value="123456" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <button class="btn-primary" onclick="login()">Login</button>
  </div>
</div>

<!-- PAGE 3: DASHBOARD - NEW PREMIUM DESIGN -->
<div id="page3" class="page hid">
  <div class="dashboard">
    <div class="topbar">
      <div class="greet">
        <h2 id="greeting">Hello, John 👋</h2>
        <small>Welcome back</small>
      </div>
      <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div class="balance-amount" id="balance">$3,501,439.22</div>
      <div class="balance-footer">
        <span>Account: **** 7756</span>
        <span><i data-lucide="eye" style="width:16px;height:16px"></i></span>
      </div>
    </div>

    <div class="actions">
      <div class="action" onclick="showPage('page4')">
        <i data-lucide="send"></i><br>
        <span>Send</span>
      </div>
      <div class="action" onclick="alert('Request Money')">
        <i data-lucide="download"></i><br>
        <span>Request</span>
      </div>
      <div class="action" onclick="alert('Top Up')">
        <i data-lucide="credit-card"></i><br>
        <span>TopUp</span>
      </div>
      <div class="action" onclick="alert('More')">
        <i data-lucide="grid-3x3"></i><br>
        <span>More</span>
      </div>
    </div>

    <h3 class="section-title">Recent Transactions</h3>
    <div class="history-box" id="history"></div>
  </div>
</div>

<!-- PAGE 4: SEND -->
<div id="page4" class="page hid" style="padding:20px">
  <div onclick="showPage('page3')" style="margin-bottom:20px;cursor:pointer"><i data-lucide="arrow-left"></i> Back</div>
  <div class="card">
    <h2>Send Money</h2>
    <h3 id="balance2" style="margin:12px 0">$3,501,439.22</h3>
    <input id="recipient" placeholder="Recipient Name" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <input id="amount" type="number" placeholder="Amount" style="width:100%;padding:14px;background:#2a2a2a;border:1px solid #333;border-radius:12px;color:#fff;margin:12px 0">
    <button class="btn-primary" onclick="sendMoney()">Send Now</button>
  </div>
</div>

<script>
lucide.createIcons();
document.querySelectorAll('.page').forEach(p=>p.classList.add('hid'));

let balance = localStorage.getItem('cashflow_balance')? parseFloat(localStorage.getItem('cashflow_balance')) : 3501439.22;
let transactions = localStorage.getItem('cashflow_tx')? JSON.parse(localStorage.getItem('cashflow_tx')) : [
  {name: "Welcome Bonus", date: "Today, 09:15 AM", amount: 2000000, type: "income", icon: "gift"},
  {name: "Netflix Subscription", date: "Yesterday", amount: 15.99, type: "expense", icon: "tv"},
  {name: "Salary Credit", date: "2 days ago", amount: 5000, type: "income", icon: "briefcase"}
];

if(localStorage.getItem('cashflow_user')){
  const name = localStorage.getItem('cashflow_user');
  document.getElementById('greeting').innerText = `Hello, ${name} 👋`;
  showPage('page3'); renderHistory();
} else { showPage('page0'); }

function formatMoney(n){ return "$" + n.toLocaleString('en-US',{minimumFractionDigits:2}); }
function saveData(){ localStorage.setItem('cashflow_balance',balance); localStorage.setItem('cashflow_tx',JSON.stringify(transactions)); }

function register(){
  const name = document.getElementById('regName').value;
  localStorage.clear(); localStorage.setItem('cashflow_user',name);
  balance = 3501439.22; saveData();
  document.getElementById('greeting').innerText = `Hello, ${name} 👋`;
  showPage('page3'); renderHistory();
}

function login(){
  const name = document.getElementById('email').value.split('@')[0];
  localStorage.setItem('cashflow_user',name);
  document.getElementById('greeting').innerText = `Hello, ${name} 👋`;
  showPage('page3'); renderHistory();
}

function logout(){ localStorage.removeItem('cashflow_user'); showPage('page0'); }

function renderHistory(){
  document.getElementById('balance').innerText = formatMoney(balance);
  document.getElementById('balance2').innerText = formatMoney(balance);
  const box = document.getElementById('history'); box.innerHTML = "";
  transactions.forEach(tx=>{
    box.innerHTML += `
    <div class="tx-item">
      <div class="tx-left">
        <div class="tx-icon"><i data-lucide="${tx.icon}" style="color:${tx.type==='income'?'var(--green)':'var(--red)'}"></i></div>
        <div>
          <div class="tx-name">${tx.name}</div>
          <div class="tx-date">${tx.date}</div>
        </div>
      </div>
      <div class="tx-amt ${tx.type}">${tx.type==='income'?'+':'-'}${formatMoney(tx.amount)}</div>
    </div>`;
  });
  lucide.createIcons();
}

function sendMoney(){
  const recipient = document.getElementById('recipient').value;
  const amount = parseFloat(document.getElementById('amount').value);
  if(amount > balance){ alert("Insufficient Balance!"); return; }
  balance -= amount;
  transactions.unshift({name:`Transfer to ${recipient}`,date:`Today, ${new Date().toLocaleTimeString()}`,amount,type:"expense",icon:"send"});
  saveData(); renderHistory(); showPage('page3');
}

function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.add('hid')); document.getElementById(id).classList.remove('hid'); }
</script>
</body>
</html>
