<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASHFLOW BANK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --green1:#6e8b3d; 
  --purple2:#2b1055; 
  --greenBtn:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:linear-gradient(180deg, var(--green1) 0%, var(--purple2) 100%);min-height:100vh;color:#fff}
.hid{display:none!important}
.center{ display:flex; justify-content:center; align-items:center; padding:20px; min-height:100vh }

/* DASHBOARD */
.dashboard{padding:20px;max-width:500px;margin:0 auto;padding-bottom:100px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h2{font-size:24px;font-weight:800}
.logout{background:rgba(255,255,255,0.2);border:none;padding:8px 16px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer}

.balance-card{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:20px;margin-bottom:20px}
.balance-card h1{font-size:32px;font-weight:800;margin-top:4px}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.action{background:rgba(255,255,255,0.15);border-radius:16px;padding:14px 0;text-align:center;cursor:pointer}

/* TRANSACTION HISTORY */
.tx-section{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:16px;padding:16px}
.tx-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700}
.tx-header a{color:#fff;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.tx-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer}
.tx-item:last-child{border:none}
.tx-left{display:flex;align-items:center;gap:12px}
.tx-icon{width:38px;height:38px;background:rgba(255,255,255,0.2);border-radius:10px;display:flex;align-items:center;justify-content:center}
.tx-info b{display:block;font-size:14px}
.tx-info small{font-size:11px;opacity:0.7}
.tx-amount{font-weight:700;font-size:14px;text-align:right}
.tx-amount.in{color:var(--greenBtn)}
.tx-amount.out{color:var(--red)}
</style>
</head>
<body>

<!-- DASHBOARD -->
<div id="dash" class="dashboard">
  <div class="topbar">
    <div>
      <h2 id="dashName">Hello Sun</h2>
      <p style="font-size:13px;opacity:0.8">Let's save your money</p>
    </div>
    <button class="logout" onclick="alert('Logged out')">Logout</button>
  </div>

  <div class="balance-card">
    <small>Available Balance</small>
    <h1 id="bal">₦2,002,665.00</h1>
  </div>

  <div class="actions">
    <div class="action"><i data-lucide="send"></i><br><span>Send</span></div>
    <div class="action"><i data-lucide="download"></i><br><span>Request</span></div>
    <div class="action"><i data-lucide="credit-card"></i><br><span>TopUp</span></div>
    <div class="action"><i data-lucide="grid-3x3"></i><br><span>More</span></div>
  </div>

  <!-- UPDATED TRANSACTION HISTORY -->
  <div class="tx-section">
    <div class="tx-header">
      <div>Recent Transactions</div>
      <a onclick="show('history')">View All</a>
    </div>
    <div id="txList"></div>
  </div>
</div>

<!-- VIEW ALL HISTORY PAGE -->
<div id="history" class="dashboard hid">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="show('dash')">
      <i data-lucide="arrow-left"></i><h2>Transaction History</h2>
    </div>
  </div>
  <div class="tx-section">
    <div id="allTxList"></div>
  </div>
</div>

<script>
lucide.createIcons();

let txs = [
  {id:"CFX9823100", name:"Salary Credit", icon:"banknote", amt:2000000.00, date:"Today, 09:15 AM", status:"Completed", to:"Company Ltd"},
  {id:"CFX9823099", name:"Internet Bill", icon:"wifi", amt:-85.00, date:"Yesterday, 8:30 PM", status:"Completed", to:"MTN Nigeria"},
  {id:"CFX9823097", name:"Client Payment", icon:"arrow-down-left", amt:500.00, date:"14 Mar, 11:45 AM", status:"Completed", to:"John Doe"},
  {id:"CFX9823096", name:"Transport", icon:"bus", amt:-120.00, date:"14 Mar, 08:00 AM", status:"Completed", to:"Uber"},
  {id:"CFX9823095", name:"Coffee", icon:"coffee", amt:-24.90, date:"13 Mar, 4:20 PM", status:"Completed", to:"Starbucks"},
  {id:"CFX9823094", name:"Refund", icon:"rotate-ccw", amt:50.00, date:"13 Mar, 1:00 PM", status:"Completed", to:"Amazon"}
];

let balance = 2002665.00; // Updated balance

function show(id){
  ['dash','history'].forEach(x=>document.getElementById(x).classList.add('hid'));
  document.getElementById(id).classList.remove('hid');
  if(id==='history') loadAllTx();
}

function loadTx(){
  let html = '';
  txs.slice(0,3).forEach(t=> { html += txRow(t); }); // show only 3 on dashboard
  document.getElementById('txList').innerHTML = html;
  document.getElementById('bal').innerText = '₦' + balance.toLocaleString(undefined,{minimumFractionDigits:2});
  lucide.createIcons();
}

function loadAllTx(){
  let html = '';
  txs.forEach(t=> { html += txRow(t); });
  document.getElementById('allTxList').innerHTML = html;
  lucide.createIcons();
}

function txRow(t){
  let type = t.amt > 0 ? 'in' : 'out';
  return `<div class="tx-item">
    <div class="tx-left">
      <div class="tx-icon"><i data-lucide="${t.icon}"></i></div>
      <div class="tx-info">
        <b>${t.name}</b>
        <small>${t.date}</small>
      </div>
    </div>
    <div class="tx-amount ${type}">${t.amt > 0 ? '+' : '-'}₦${Math.abs(t.amt).toLocaleString(undefined,{minimumFractionDigits:2})}</div>
  </div>`;
}

loadTx();
</script>
</body>
</html>
